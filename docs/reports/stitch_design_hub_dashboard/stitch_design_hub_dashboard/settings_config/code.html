<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #131b2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d494c;
        }

<body class="flex h-screen overflow-hidden">

    <!-- SideNavBar (Authority: JSON) -->
    <aside class="flex flex-col h-full overflow-y-auto bg-surface-container-low w-64 border-r border-outline-variant">
        <div class="p-lg">
            <h1 class="font-h1 text-h1 font-bold text-primary">POLY-BOT-01</h1>
            <p class="font-data-sm text-data-sm text-on-surface-variant mt-xs">V2.4.0-STABLE</p>
        </div>
        
        <nav class="flex-1 px-md mt-lg space-y-xs">
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 hover:bg-surface-container-highest text-on-surface-variant scale-95 active:scale-90">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="font-data-md text-data-md">Overview</span>
            </div>
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 hover:bg-surface-container-highest text-on-surface-variant scale-95 active:scale-90">
                <span class="material-symbols-outlined">query_stats</span>
                <span class="font-data-md text-data-md">Markets</span>
            </div>
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 hover:bg-surface-container-highest text-on-surface-variant scale-95 active:scale-90">
                <span class="material-symbols-outlined">swap_horiz</span>
                <span class="font-data-md text-data-md">Trades</span>
            </div>
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 hover:bg-surface-container-highest text-on-surface-variant scale-95 active:scale-90">
                <span class="material-symbols-outlined">gpp_maybe</span>
                <span class="font-data-md text-data-md">Risk</span>
            </div>
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 hover:bg-surface-container-highest text-on-surface-variant scale-95 active:scale-90">
                <span class="material-symbols-outlined">dns</span>
                <span class="font-data-md text-data-md">System</span>
            </div>
            <!-- Active State: Settings -->
            <div class="flex items-center gap-md px-md py-sm cursor-pointer transition-colors duration-150 text-primary border-l-2 border-primary bg-surface-container-high scale-95 active:scale-90">
                <span class="material-symbols-outlined">settings</span>
                <span class="font-data-md text-data-md">Settings</span>
            </div>
        </nav>

        <div class="p-md mt-auto border-t border-outline-variant">
            <button class="w-full bg-error-container text-on-error-container py-md px-md font-label-caps text-label-caps uppercase hover:brightness-110 active:scale-95 transition-all">
                Manual Killswitch
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-surface">
        
        <!-- TopNavBar (Authority: JSON) -->
        <header class="flex justify-between items-center w-full px-6 bg-surface h-16 border-b border-outline-variant">
            <div class="flex items-center gap-lg">
                <h2 class="font-h2 text-h2 font-bold text-on-surface">Terminal Console</h2>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline">
                        <span class="material-symbols-outlined text-[18px]">search</span>
                    </span>
                    <input type="text" placeholder="Search parameters..." class="bg-surface-container-low border border-outline-variant text-on-surface font-data-sm text-data-sm pl-10 pr-4 py-1.5 focus:outline-none focus:border-primary w-64 transition-all">
                </div>
            </div>

            <div class="flex items-center gap-lg">
                <div class="flex items-center gap-md font-data-md text-data-md">
                    <div class="flex flex-col items-end">
                        <span class="text-on-surface-variant text-[10px] uppercase font-bold tracking-widest">Global Balance</span>
                        <span class="text-secondary">$42,084.12</span>
                    </div>
                    <div class="h-8 w-[1px] bg-outline-variant mx-sm"></div>
                    <div class="flex items-center gap-sm text-primary">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                        </span>
                        <span class="font-bold">Running</span>
                    </div>
                </div>
                <div class="flex items-center gap-sm">
                    <span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-opacity">notifications</span>
                    <span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-opacity">account_balance_wallet</span>
                    <span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-opacity">sensors</span>
                </div>
            </div>
        </header>

        <!-- Configuration Body -->
        <div class="flex-1 overflow-y-auto p-lg">
            <!-- Environment Banner -->
            <div class="mb-lg p-md bg-surface-container-high border-l-4 border-secondary flex justify-between items-center">
                <div class="flex items-center gap-md">
                    <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">science</span>
                    <div>
                        <h3 class="font-h2 text-h2 text-on-surface">PAPER TRADING MODE ACTIVE</h3>
                        <p class="font-data-sm text-data-sm text-on-surface-variant">Simulated environment using virtual funds. No actual capital is at risk.</p>
                    </div>
                </div>
                <div class="bg-surface-container-lowest border border-outline-variant px-md py-sm font-data-md text-data-md">
                    <span class="text-on-surface-variant uppercase text-[10px] block font-bold">Simulator Latency</span>
                    <span class="text-primary font-mono">1.2ms</span>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-lg">
                <!-- Primary Settings Column -->
                <div class="col-span-12 lg:col-span-8 space-y-lg">
                    <!-- Global Configuration Card -->
                    <div class="bg-surface-container-low border border-outline-variant">
                        <div class="px-md py-sm border-b border-outline-variant bg-surface-container flex items-center justify-between">
                            <span class="font-h2 text-h2">Global Parameters</span>
                            <span class="font-label-caps text-label-caps text-on-surface-variant">NODE: US-EAST-01</span>
                        </div>
                        <div class="p-lg grid grid-cols-2 gap-xl">
                            <!-- Field: Environment Toggle -->
                            <div class="space-y-sm">
                                <label class="font-label-caps text-label-caps text-on-surface-variant block">ENVIRONMENT MODE</label>
                                <div class="flex border border-outline-variant p-xs bg-surface-container-lowest">
                                    <button class="flex-1 py-sm font-data-md text-data-md bg-primary text-on-primary">Paper</button>
                                    <button class="flex-1 py-sm font-data-md text-data-md text-on-surface-variant hover:text-on-surface transition-colors">Live Production</button>
                                </div>
                                <p class="text-[10px] text-on-surface-variant italic">Switching to Live requires Multi-Sig validation.</p>
                            </div>

                            <!-- Field: Starting Balance -->
                            <div class="space-y-sm">
                                <label class="font-label-caps text-label-caps text-on-surface-variant block">SIMULATION STARTING BALANCE (USD)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline font-mono">$</span>
                                    <input type="text" value="50,000.00" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-data-lg text-data-lg pl-8 pr-4 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                                </div>
                            </div>

                            <!-- Field: API URL -->
                            <div class="col-span-2 space-y-sm">
                                <label class="font-label-caps text-label-caps text-on-surface-variant block">API BASE ENDPOINT</label>
                                <div class="flex gap-xs">
                                    <input type="text" value="https://api.polybot-quant.io/v2/exec" class="flex-1 bg-surface-container-lowest border border-outline-variant text-on-surface font-data-md text-data-md px-md py-2 focus:outline-none focus:border-primary transition-all">
                                    <button class="px-md border border-outline-variant hover:bg-surface-container-highest transition-colors font-data-md text-data-md">TEST</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Risk Control Card -->
                    <div class="bg-surface-container-low border border-outline-variant">
                        <div class="px-md py-sm border-b border-outline-variant bg-surface-container flex items-center gap-sm">
                            <span class="material-symbols-outlined text-primary text-[20px]">security</span>
                            <span class="font-h2 text-h2">Risk Guardrails</span>
                        </div>
                        <div class="p-lg grid grid-cols-3 gap-md">
                            <div class="p-md bg-surface-container-lowest border border-outline-variant">
                                <span class="font-label-caps text-label-caps text-on-surface-variant block">MAX DRAWDOWN</span>
                                <span class="font-data-lg text-data-lg text-primary">2.5%</span>
                            </div>
                            <div class="p-md bg-surface-container-lowest border border-outline-variant">
                                <span class="font-label-caps text-label-caps text-on-surface-variant block">DAILY LOSS CAP</span>
                                <span class="font-data-lg text-data-lg text-primary">$1,200.00</span>
                            </div>
                            <div class="p-md bg-surface-container-lowest border border-outline-variant">
                                <span class="font-label-caps text-label-caps text-on-surface-variant block">AUTO-DELEVERAGE</span>
                                <span class="font-data-lg text-data-lg text-secondary">ACTIVE</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Actions & Meta -->
                <div class="col-span-12 lg:col-span-4 space-y-lg">
                    <!-- Advanced Maintenance -->
                    <div class="bg-surface-container-low border border-outline-variant overflow-hidden">
                        <div class="px-md py-sm border-b border-outline-variant bg-surface-container">
                            <span class="font-h2 text-h2 text-error">Danger Zone</span>
                        </div>
                        <div class="p-lg space-y-md">
                            <div class="p-md border border-error-container/30 bg-error-container/5 rounded-lg">
                                <h4 class="font-data-md text-data-md text-error font-bold">Safe Reset</h4>
                                <p class="font-data-sm text-data-sm text-on-surface-variant mt-xs leading-relaxed">
                                    Resets all paper trading parameters to factory defaults. This action will clear open positions, order history, and re-initialize balance.
                                </p>
                            </div>
                            
                            <div class="space-y-sm">
                                <div class="flex items-center gap-sm">
                                    <input type="checkbox" id="confirm-reset" class="rounded-xs bg-surface-container-lowest border-outline-variant text-primary focus:ring-primary h-4 w-4">
                                    <label for="confirm-reset" class="font-data-sm text-data-sm text-on-surface">I confirm this destructive action</label>
                                </div>
                                <button class="w-full bg-error text-on-error py-md px-md font-label-caps text-label-caps uppercase hover:brightness-110 active:scale-95 transition-all opacity-50 cursor-not-allowed">
                                    Execute Safe Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Bot Information -->
                    <div class="p-lg bg-surface-container-high border border-outline-variant flex flex-col items-center text-center">
                        <div class="w-24 h-24 mb-md relative">
                            <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=PolyBot1" alt="Bot Logo" class="w-full h-full grayscale opacity-80" data-alt="A stylized, technical minimalist robot head icon presented as a flat vector graphic. The robot features sharp geometric lines and glowing cyan circular eye sensors that imply a high-performance quantitative trading personality. It is rendered against a deep navy blue background with a subtle digital grid pattern. The overall aesthetic is clinical, aerospace-inspired, and professional.">
                            <div class="absolute bottom-1 right-1 w-4 h-4 bg-primary border-2 border-surface rounded-full"></div>
                        </div>
                        <h4 class="font-h2 text-h2">POLY-BOT-01</h4>
                        <p class="font-data-sm text-data-sm text-on-surface-variant">Core Engine 2.4.0-S</p>
                        <div class="mt-lg w-full pt-lg border-t border-outline-variant grid grid-cols-2 gap-sm">
                            <div class="text-left">
                                <span class="font-label-caps text-label-caps text-on-surface-variant block">UPTIME</span>
                                <span class="font-data-md text-data-md">14d 06h 12m</span>
                            </div>
                            <div class="text-left">
                                <span class="font-label-caps text-label-caps text-on-surface-variant block">CPU LOAD</span>
                                <span class="font-data-md text-data-md">4.2%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sticky Footer Actions -->
        <footer class="p-md bg-surface border-t border-outline-variant flex justify-end items-center gap-md">
            <button class="px-lg py-sm font-data-md text-data-md text-on-surface-variant hover:text-on-surface transition-colors">Discard Changes</button>
            <button class="px-xl py-sm bg-primary text-on-primary font-data-md text-data-md font-bold hover:brightness-110 active:scale-95 transition-all">Save Configuration</button>
        </footer>
    </main>
</body>
</html></style></head><body></body></html>
