name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy flake8 pytest pytest-cov pytest-asyncio

      - name: Run MyPy type checking
        run: |
          mypy src/utils/config.py src/utils/logger.py --ignore-missing-imports || true

      - name: Run Flake8 linting
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests with Coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: polymarket-bot

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flake8 black isort

      - name: Check code formatting with Black
        run: black --check src || true

      - name: Check import order with isort
        run: isort --check src || true

      - name: Run full flake8
        run: flake8 src --max-line-length=120